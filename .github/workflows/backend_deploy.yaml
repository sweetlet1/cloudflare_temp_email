name: Deploy Backend
on:
  workflow_run:
    workflows: [Upstream Sync]
    types: [completed]
  push:
    tags:
      - "*"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_TOML_CONTENT: ${{ secrets.BACKEND_TOML }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install pnpm
        uses: pnpm/action-setup@v5
        id: pnpm-install
        with:
          version: 10
          run_install: false
      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-pnpm-frontend-${{ hashFiles('frontend/pnpm-lock.yaml') }}
      - name: Cache npm worker dependencies
        uses: actions/cache@v4
        with:
          path: worker/node_modules
          key: ${{ runner.os }}-npm-worker-${{ hashFiles('worker/package-lock.json','worker/package.json') }}
      - name: Upgrade wrangler to latest
        run: npm install -g wrangler@latest
      - name: Deploy Backend for ${{ github.ref_name }}
        run: |
          echo "CLOUDFLARE_ACCOUNT_ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "CLOUDFLARE_API_TOKEN length: ${#CLOUDFLARE_API_TOKEN}"
          export use_worker_assets=${{ secrets.USE_WORKER_ASSETS }}
          export use_worker_assets_with_telegram=${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          if [ -n "$use_worker_assets" ]; then
            cd frontend/
            pnpm install --no-frozen-lockfile
            if [ -n "$use_worker_assets_with_telegram" ]; then
              echo "Building with telegram pages"
              pnpm build:telegram:pages
            else
              echo "Building with normal pages"
              pnpm build:pages
            fi
            cd ..
          fi
          export debug_mode=${{ secrets.DEBUG_MODE }}
          export use_mail_wasm_parser=${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
          cd worker/
          printf '%s\n' "$WRANGLER_TOML_CONTENT" > wrangler.toml
          npm install
          if [ -n "$use_mail_wasm_parser" ]; then
            echo "Using mail‑parser‑wasm‑worker"
            npm install mail-parser-wasm-worker
            PATCH_FILE="../.github/config/mail-parser-wasm-worker.patch"
            if [ -f "$PATCH_FILE" ]; then
              git apply "$PATCH_FILE"
              echo "Patch applied successfully"
            else
              echo "Warning: patch file $PATCH_FILE not found, skip patching"
            fi
          fi
          if [ "$debug_mode" = "true" ]; then
            npx wrangler deploy
          else
            npx wrangler deploy >/dev/null
            DEPLOY_EXIT=$?
            if [ $DEPLOY_EXIT -ne 0 ]; then
              echo "wrangler deploy failed, exit code: $DEPLOY_EXIT"
              exit $DEPLOY_EXIT
            fi
          fi
          echo "✅ Deployed for tag ${{ github.ref_name }}"
        env:
          USE_WORKER_ASSETS: ${{ secrets.USE_WORKER_ASSETS }}
          USE_WORKER_ASSETS_WITH_TELEGRAM: ${{ secrets.USE_WORKER_ASSETS_WITH_TELEGRAM }}
          DEBUG_MODE: ${{ secrets.DEBUG_MODE }}
          BACKEND_USE_MAIL_WASM_PARSER: ${{ secrets.BACKEND_USE_MAIL_WASM_PARSER }}
